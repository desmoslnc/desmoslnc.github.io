
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula Chat</title>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://ltsxfvzxcnouqnphowtl.supabase.co";
const SUPABASE_KEY = "sb_publishable_-N81IyLzD7OivhCO0-H9gg_eX1z62w6";

const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let myProfile = null;
let profiles = {};
let messages = [];
let emojiOpen = false;

const $ = id => document.getElementById(id);

function escapeText(value) {
    return String(value);
}

function showStatus(message) {
    $("status").textContent = message;
}

async function initialize() {
    showStatus("Connecting to Nebula...");

    let { data: { session }, error } = await db.auth.getSession();

    if (error) throw error;

    if (!session) {
        const result = await db.auth.signInAnonymously();
        if (result.error) {
            throw new Error(
                "Could not sign in. Enable Anonymous Sign-Ins in Supabase Authentication settings. " +
                result.error.message
            );
        }
        session = result.data.session;
    }

    currentUser = session.user;

    await loadProfile();
    await loadMessages();

    db.channel("nebula-messages")
        .on("postgres_changes", {
            event: "*",
            schema: "public",
            table: "messages"
        }, loadMessages)
        .subscribe();

    showStatus("Connected to Nebula");
    updateInterface();
}

async function loadProfile() {
    const { data, error } = await db
        .from("profiles")
        .select("*")
        .eq("user_id", currentUser.id)
        .single();

    if (error) throw error;

    myProfile = data;
}

async function loadMessages() {
    const [messageResult, profileResult] = await Promise.all([
        db.from("messages")
            .select("*")
            .order("created_at", { ascending: true })
            .limit(150),

        db.from("profiles").select("*")
    ]);

    if (messageResult.error) {
        showStatus(messageResult.error.message);
        return;
    }

    if (profileResult.error) {
        showStatus(profileResult.error.message);
        return;
    }

    messages = messageResult.data || [];
    profiles = {};

    (profileResult.data || []).forEach(profile => {
        profiles[profile.user_id] = profile;
    });

    renderMessages();
    updateInterface();
}

function updateInterface() {
    $("usernameLabel").textContent = myProfile.username;
    $("roleLabel").textContent = myProfile.role.toUpperCase();

    $("adminButton").hidden =
        !["admin", "owner"].includes(myProfile.role);

    $("sendButton").disabled = myProfile.banned;
    $("messageInput").disabled = myProfile.banned;

    if (myProfile.banned) {
        showStatus("Your account has been restricted.");
    }
}

function renderMessages() {
    const container = $("messages");
    container.replaceChildren();

    messages.forEach(message => {
        const profile = profiles[message.user_id];
        const username = profile?.username || "User";
        const isMine = message.user_id === currentUser.id;
        const isModerator = ["admin", "owner"].includes(myProfile.role);

        const wrapper = document.createElement("div");
        wrapper.className = "message " + (isMine ? "mine" : "");

        const header = document.createElement("div");
        header.className = "message-header";

        const name = document.createElement("span");
        name.className = "message-name";
        name.textContent = username;

        if (profile?.role === "owner") {
            name.textContent += " 👑";
        } else if (profile?.role === "admin") {
            name.textContent += " 🛡️";
        }

        const time = document.createElement("span");
        time.className = "message-time";
        time.textContent = new Date(message.created_at)
            .toLocaleTimeString([], {
                hour: "numeric",
                minute: "2-digit"
            });

        header.append(name, time);

        const content = document.createElement("div");
        content.className = "message-content";
        content.textContent = message.content;

        wrapper.append(header, content);

        if (message.edited_at) {
            const edited = document.createElement("span");
            edited.className = "edited";
            edited.textContent = "(edited)";
            wrapper.append(edited);
        }

        const actions = document.createElement("div");
        actions.className = "message-actions";

        if (isMine) {
            const edit = document.createElement("button");
            edit.textContent = "Edit";
            edit.onclick = () => editMessage(message);
            actions.append(edit);
        }

        if (isMine || isModerator) {
            const remove = document.createElement("button");
            remove.textContent = "Delete";
            remove.onclick = () => deleteMessage(message);
            actions.append(remove);
        }

        if (actions.children.length) {
            wrapper.append(actions);
        }

        container.append(wrapper);
    });

    container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
    const input = $("messageInput");
    const content = input.value.trim();

    if (!content || myProfile.banned) return;

    $("sendButton").disabled = true;

    const { error } = await db.from("messages").insert({
        user_id: currentUser.id,
        content
    });

    $("sendButton").disabled = myProfile.banned;

    if (error) {
        showStatus("Message failed: " + error.message);
        return;
    }

    input.value = "";
    input.focus();
    loadMessages();
}

async function editMessage(message) {
    const updated = prompt("Edit your message:", message.content);

    if (updated === null) return;

    if (!updated.trim() || updated.length > 2000) {
        alert("Messages must contain 1–2000 characters.");
        return;
    }

    const { error } = await db.from("messages")
        .update({ content: updated.trim() })
        .eq("id", message.id)
        .eq("user_id", currentUser.id);

    if (error) {
        alert(error.message);
        return;
    }

    loadMessages();
}

async function deleteMessage(message) {
    if (!confirm("Delete this message?")) return;

    const { error } = await db.from("messages")
        .delete()
        .eq("id", message.id);

    if (error) {
        alert(error.message);
        return;
    }

    loadMessages();
}

function openProfile() {
    $("profileName").value = myProfile.username;
    $("accountId").textContent = currentUser.id;
    $("profileModal").hidden = false;
}

async function saveProfile() {
    const username = $("profileName").value.trim();

    if (username.length < 1 || username.length > 24) {
        alert("Username must be between 1 and 24 characters.");
        return;
    }

    const { error } = await db.from("profiles")
        .update({ username })
        .eq("user_id", currentUser.id);

    if (error) {
        alert(error.message);
        return;
    }

    await loadProfile();
    await loadMessages();

    $("profileModal").hidden = true;
}

const emojis = [
    "😀","😎","😂","🤣","😊","😍","🥰","😭",
    "💀","🔥","❤️","💜","💙","👍","👎","👏",
    "🎉","✨","🚀","👀","🤔","😴","🙏","😈",
    "💯","🤝","🙌","🥳","🤯","😅","😏","🫡"
];

function buildEmojiPicker() {
    const picker = $("emojiPicker");

    emojis.forEach(emoji => {
        const button = document.createElement("button");
        button.textContent = emoji;
        button.className = "emoji-option";

        button.onclick = () => {
            const input = $("messageInput");
            const start = input.selectionStart;
            const end = input.selectionEnd;

            input.value =
                input.value.slice(0, start) +
                emoji +
                input.value.slice(end);

            input.focus();
            input.selectionStart = input.selectionEnd =
                start + emoji.length;

            picker.hidden = true;
        };

        picker.append(button);
    });
}

function toggleEmoji() {
    $("emojiPicker").hidden = !$("emojiPicker").hidden;
}

function openAdmin() {
    if (!["admin", "owner"].includes(myProfile.role)) return;

    $("adminModal").hidden = false;
    loadAdminUsers();
}

async function loadAdminUsers() {
    const list = $("userList");
    list.replaceChildren();

    const { data, error } = await db.from("profiles")
        .select("*")
        .order("created_at");

    if (error) {
        list.textContent = error.message;
        return;
    }

    data.forEach(user => {
        const row = document.createElement("div");
        row.className = "user-row";

        const info = document.createElement("div");
        info.className = "user-info";

        const username = document.createElement("strong");
        username.textContent = user.username;

        const role = document.createElement("small");
        role.textContent = user.role.toUpperCase() +
            (user.banned ? " • BANNED" : "");

        info.append(username, role);
        row.append(info);

        if (user.user_id === currentUser.id || user.role === "owner") {
            const protectedLabel = document.createElement("small");
            protectedLabel.textContent = user.user_id === currentUser.id
                ? "You"
                : "Protected owner";
            row.append(protectedLabel);
        } else {
            if (myProfile.role === "owner") {
                const promote = document.createElement("button");

                promote.textContent = user.role === "admin"
                    ? "Remove admin"
                    : "Make admin";

                promote.onclick = async () => {
                    const { error } = await db.rpc("set_admin", {
                        target_user: user.user_id,
                        make_admin: user.role !== "admin"
                    });

                    if (error) {
                        alert(error.message);
                        return;
                    }

                    loadAdminUsers();
                };

                row.append(promote);
            }

            const ban = document.createElement("button");
            ban.textContent = user.banned ? "Unban" : "Ban";

            ban.onclick = async () => {
                const { error } = await db.rpc("set_banned", {
                    target_user: user.user_id,
                    should_ban: !user.banned
                });

                if (error) {
                    alert(error.message);
                    return;
                }

                loadAdminUsers();
            };

            row.append(ban);
        }

        list.append(row);
    });
}

$("sendButton").onclick = sendMessage;
$("profileButton").onclick = openProfile;
$("saveProfile").onclick = saveProfile;
$("closeProfile").onclick = () => $("profileModal").hidden = true;
$("emojiButton").onclick = toggleEmoji;
$("adminButton").onclick = openAdmin;
$("closeAdmin").onclick = () => $("adminModal").hidden = true;

$("messageInput").addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

buildEmojiPicker();

initialize().catch(error => {
    showStatus("Connection error: " + error.message);
    console.error(error);
});
</script>

    }

<div id="app">

    <header class="topbar">
        <div class="logo">✦ Nebula Chat</div>
        <div class="status" id="status">Connecting...</div>
    </header>

    <main id="messages"></main>

    <footer class="composer">

        <button class="profile-button" id="profileButton"
            title="Edit profile">♙</button>

        <div class="input-wrap">
            <textarea id="messageInput"
                placeholder="Type a message..."
                maxlength="2000"></textarea>

            <button id="emojiButton" title="Emojis">☺</button>
            <div id="emojiPicker" hidden></div>
        </div>

        <button class="send-button" id="sendButton"
            title="Send message">➤</button>

    </footer>

</div>

<div class="modal" id="profileModal" hidden>
    <div class="modal-box">
        <h2>Your Profile</h2>

        <label for="profileName">Display name</label>
        <input id="profileName" maxlength="24"
            placeholder="Choose a username">

        <div class="account-id">
            Your account ID (needed to register the owner):
            <br>
            <span id="accountId"></span>
        </div>

        <button id="saveProfile">Save username</button>
        <button class="secondary" id="closeProfile">Close</button>
    </div>
</div>

<div class="modal" id="adminModal" hidden>
    <div class="modal-box">
        <h2>✦ Nebula Administration</h2>
        <p id="roleLabel"></p>
        <div id="userList">Loading users...</div>
        <button class="secondary" id="closeAdmin">Close</button>
    </div>
</div>

</body>

async function editMessage(message) {
    const updated = prompt("Edit your message:", message.content);

    if (updated === null) return;

    if (!updated.trim() || updated.length > 2000) {
        alert("Messages must contain 1–2000 characters.");
        return;
    }

    const { error } = await db.from("messages")
        .update({ content: updated.trim() })
        .eq("id", message.id)
        .eq("user_id", currentUser.id);

    if (error) {
        alert(error.message);
        return;
    }

    loadMessages();
}

async function deleteMessage(message) {
    if (!confirm("Delete this message?")) return;

    const { error } = await db.from("messages")
        .delete()
        .eq("id", message.id);

    if (error) {
        alert(error.message);
        return;
    }

    loadMessages();
}

function openProfile() {
    $("profileName").value = myProfile.username;
    $("accountId").textContent = currentUser.id;
    $("profileModal").hidden = false;
}

async function saveProfile() {
    const username = $("profileName").value.trim();

    if (username.length < 1 || username.length > 24) {
        alert("Username must be between 1 and 24 characters.");
        return;
    }

    const { error } = await db.from("profiles")
        .update({ username })
        .eq("user_id", currentUser.id);

    if (error) {
        alert(error.message);
        return;
    }

    await loadProfile();
    await loadMessages();

    $("profileModal").hidden = true;
}

const emojis = [
    "😀","😎","😂","🤣","😊","😍","🥰","😭",
    "💀","🔥","❤️","💜","💙","👍","👎","👏",
    "🎉","✨","🚀","👀","🤔","😴","🙏","😈",
    "💯","🤝","🙌","🥳","🤯","😅","😏","🫡"
];

function buildEmojiPicker() {
    const picker = $("emojiPicker");

    emojis.forEach(emoji => {
        const button = document.createElement("button");
        button.textContent = emoji;
        button.className = "emoji-option";

        button.onclick = () => {
            const input = $("messageInput");
            const start = input.selectionStart;
            const end = input.selectionEnd;

            input.value =
                input.value.slice(0, start) +
                emoji +
                input.value.slice(end);

            input.focus();
            input.selectionStart = input.selectionEnd =
                start + emoji.length;

            picker.hidden = true;
        };

        picker.append(button);
    });
}

function toggleEmoji() {
    $("emojiPicker").hidden = !$("emojiPicker").hidden;
}

function openAdmin() {
    if (!["admin", "owner"].includes(myProfile.role)) return;

    $("adminModal").hidden = false;
    loadAdminUsers();
}

async function loadAdminUsers() {
    const list = $("userList");
    list.replaceChildren();

    const { data, error } = await db.from("profiles")
        .select("*")
        .order("created_at");

    if (error) {
        list.textContent = error.message;
        return;
    }

    data.forEach(user => {
        const row = document.createElement("div");
        row.className = "user-row";

        const info = document.createElement("div");
        info.className = "user-info";

        const username = document.createElement("strong");
        username.textContent = user.username;

        const role = document.createElement("small");
        role.textContent = user.role.toUpperCase() +
            (user.banned ? " • BANNED" : "");

        info.append(username, role);
        row.append(info);

        if (user.user_id === currentUser.id || user.role === "owner") {
            const protectedLabel = document.createElement("small");
            protectedLabel.textContent = user.user_id === currentUser.id
                ? "You"
                : "Protected owner";
            row.append(protectedLabel);
        } else {
            if (myProfile.role === "owner") {
                const promote = document.createElement("button");

                promote.textContent = user.role === "admin"
                    ? "Remove admin"
                    : "Make admin";

                promote.onclick = async () => {
                    const { error } = await db.rpc("set_admin", {
                        target_user: user.user_id,
                        make_admin: user.role !== "admin"
                    });

                    if (error) {
                        alert(error.message);
                        return;
                    }

                    loadAdminUsers();
                };

                row.append(promote);
            }

            const ban = document.createElement("button");
            ban.textContent = user.banned ? "Unban" : "Ban";

            ban.onclick = async () => {
                const { error } = await db.rpc("set_banned", {
                    target_user: user.user_id,
                    should_ban: !user.banned
                });

                if (error) {
                    alert(error.message);
                    return;
                }

                loadAdminUsers();
            };

            row.append(ban);
        }

        list.append(row);
    });
}

$("sendButton").onclick = sendMessage;
$("profileButton").onclick = openProfile;
$("saveProfile").onclick = saveProfile;
$("closeProfile").onclick = () => $("profileModal").hidden = true;
$("emojiButton").onclick = toggleEmoji;
$("adminButton").onclick = openAdmin;
$("closeAdmin").onclick = () => $("adminModal").hidden = true;

$("messageInput").addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

buildEmojiPicker();

initialize().catch(error => {
    showStatus("Connection error: " + error.message);
    console.error(error);
});
</script>

<body>
<div id="app">

    <header class="topbar">
        <div class="logo">✦ Nebula Chat</div>
        <div class="status" id="status">Connecting...</div>
    </header>

    <main id="messages"></main>

    <footer class="composer">

        <button class="profile-button" id="profileButton"
            title="Edit profile">♙</button>

        <div class="input-wrap">
            <textarea id="messageInput"
                placeholder="Type a message..."
                maxlength="2000"></textarea>

            <button id="emojiButton" title="Emojis">☺</button>
            <div id="emojiPicker" hidden></div>
        </div>

        <button class="send-button" id="sendButton"
            title="Send message">➤</button>

    </footer>

</div>

<div class="modal" id="profileModal" hidden>
    <div class="modal-box">
        <h2>Your Profile</h2>

        <label for="profileName">Display name</label>
        <input id="profileName" maxlength="24"
            placeholder="Choose a username">

        <div class="account-id">
            Your account ID (needed to register the owner):
            <br>
            <span id="accountId"></span>
        </div>

        <button id="saveProfile">Save username</button>
        <button class="secondary" id="closeProfile">Close</button>
    </div>
</div>

<div class="modal" id="adminModal" hidden>
    <div class="modal-box">
        <h2>✦ Nebula Administration</h2>
        <p id="roleLabel"></p>
        <div id="userList">Loading users...</div>
