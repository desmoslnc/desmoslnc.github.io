
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;
    height: 100dvh;
    overflow: hidden;
}

.chat {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 1100px;
    margin: auto;
    background: #17171d;
}

.header {
    height: 70px;
    flex-shrink: 0;
    background: #1e1e27;
    border-bottom: 1px solid #30303b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
}

.header h2 {
    font-size: 19px;
}

.status {
    font-size: 12px;
    color: #55d995;
}

.status::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #55d995;
    border-radius: 50%;
    margin-right: 7px;
}

.username-bar {
    background: #191921;
    padding: 10px 18px;
    border-bottom: 1px solid #30303b;
    display: flex;
    align-items: center;
    gap: 10px;
}

.username-bar input {
    width: 180px;
    background: #252530;
    border: 1px solid #393947;
    border-radius: 8px;
    padding: 9px;
    color: white;
    outline: none;
}

.username-bar button {
    background: #343444;
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    color: white;
    cursor: pointer;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    scroll-behavior: smooth;
}

.message {
    background: #22222c;
    padding: 12px 15px;
    border-radius: 12px;
    max-width: 85%;
    width: fit-content;
    overflow-wrap: anywhere;
}

.message.own {
    align-self: flex-end;
    background: #34305b;
}

.message-info {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
}

.message-user {
    font-weight: bold;
    color: #a99cff;
    font-size: 13px;
}

.message-time {
    color: #888895;
    font-size: 11px;
}

.message-content {
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.system {
    text-align: center;
    color: #888895;
    font-size: 13px;
    padding: 15px;
}

.input-area {
    background: #1e1e27;
    border-top: 1px solid #30303b;
    padding: 15px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
}

.input-area textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    height: 48px;
    max-height: 120px;
    background: #292934;
    border: 1px solid #414150;
    border-radius: 10px;
    color: white;
    padding: 14px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    outline: none;
}

.input-area textarea:focus {
    border-color: #9181ff;
}

.send {
    background: #7965ed;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 23px;
    font-weight: bold;
    cursor: pointer;
}

.send:hover {
    background: #8978ff;
}

.send:disabled {
    opacity: .5;
    cursor: not-allowed;
}

@media(max-width: 600px) {
    .header {
        padding: 0 14px;
    }

    .messages {
        padding: 12px;
    }

    .message {
        max-width: 95%;
    }

    .input-area {
        padding: 10px;
    }

    .send {
        padding: 0 15px;
    }

    .username-bar input {
        width: 130px;
    }
}
</style>
</head>

<body>

<div class="chat">

    <div class="header">
        <h2>🌐 Community Chat</h2>
        <span class="status" id="status">Connecting...</span>
    </div>

    <div class="username-bar">
        <span>Username:</span>
        <input id="username" maxlength="24" placeholder="Your username">
        <button id="saveName">Save</button>
    </div>

    <div class="messages" id="messages">
        <div class="system">Connecting to chat...</div>
    </div>

    <div class="input-area">
        <textarea id="messageInput"
        maxlength="1000"
        placeholder="Type a message..."></textarea>

        <button class="send" id="sendButton">Send</button>
    </div>

</div>

<script>
// ==========================================
// SUPABASE CONFIGURATION
// ==========================================

const SUPABASE_URL = "https://ltsxfvzxcnouqnphowtl.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_-N81IyLzD7OivhCO0-H9gg_eX1z62w6";

// ==========================================
// INITIALIZATION
// ==========================================

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const messagesBox = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const usernameInput = document.getElementById("username");
const statusText = document.getElementById("status");

let currentUser = null;
let sending = false;

usernameInput.value =
    localStorage.getItem("chat_username") || "";

// ==========================================
// USERNAME
// ==========================================

function getUsername() {
    return usernameInput.value.trim()
        .replace(/\s+/g, " ")
        .slice(0, 24);
}

document.getElementById("saveName").onclick = () => {
    const name = getUsername();

    if (!name) {
        alert("Please enter a username.");
        return;
    }

    usernameInput.value = name;
    localStorage.setItem("chat_username", name);
};

// ==========================================
// DISPLAY MESSAGES
// ==========================================

function displayMessage(message) {

    // Avoid displaying duplicates
    if (document.querySelector(
        `[data-message-id="${message.id}"]`
    )) return;

    const empty = messagesBox.querySelector(".system");
    if (empty) empty.remove();

    const wrapper = document.createElement("div");
    wrapper.className = "message";

    if (currentUser && message.user_id === currentUser.id) {
        wrapper.classList.add("own");
    }

    wrapper.dataset.messageId = message.id;

    const info = document.createElement("div");
    info.className = "message-info";

    const username = document.createElement("span");
    username.className = "message-user";
    username.textContent = message.username || "Anonymous";

    const time = document.createElement("span");
    time.className = "message-time";

    time.textContent = message.created_at
        ? new Date(message.created_at).toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        })
        : "";

    const content = document.createElement("div");
    content.className = "message-content";

    // textContent prevents HTML/script injection
    content.textContent = message.content;

    info.appendChild(username);
    info.appendChild(time);

    wrapper.appendChild(info);
    wrapper.appendChild(content);

    messagesBox.appendChild(wrapper);

    messagesBox.scrollTop = messagesBox.scrollHeight;
}

// ==========================================
// LOAD MESSAGE HISTORY
// ==========================================

async function loadMessages() {

    messagesBox.innerHTML =
        '<div class="system">Loading messages...</div>';

    const { data, error } = await supabase
        .from("messages")
        .select("id,user_id,username,content,created_at")
        .order("created_at", { ascending: true })
        .limit(100);

    if (error) {
        messagesBox.innerHTML =
            '<div class="system">Could not load messages. Check your database permissions.</div>';

        console.error(error);
        return;
    }

    messagesBox.innerHTML = "";

    if (!data || data.length === 0) {
        messagesBox.innerHTML =
            '<div class="system">Welcome! Start the conversation.</div>';
        return;
    }

    data.forEach(displayMessage);

    messagesBox.scrollTop = messagesBox.scrollHeight;
}

// ==========================================
// REALTIME MESSAGING
// ==========================================

function connectRealtime() {

    const channel = supabase
        .channel("community-chat-live")
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages"
            },
            payload => {
                displayMessage(payload.new);
            }
        )
        .subscribe((state) => {

            if (state === "SUBSCRIBED") {
                statusText.textContent = "Live";
            }

            if (state === "CHANNEL_ERROR" ||
                state === "TIMED_OUT") {
                statusText.textContent = "Reconnecting...";
            }

        });

}

// ==========================================
// SEND MESSAGES
// ==========================================

async function sendMessage() {

    if (sending) return;

    const content = input.value.trim();
    const username = getUsername();

    if (!content) return;

    if (!username) {
        alert("Please choose a username first.");
        usernameInput.focus();
        return;
    }

    if (!currentUser) {
        alert("Still connecting. Please try again.");
        return;
    }

    sending = true;
    sendButton.disabled = true;

    localStorage.setItem("chat_username", username);

    const { error } = await supabase
        .from("messages")
        .insert({
            user_id: currentUser.id,
            username: username,
            content: content
        });

    if (error) {
        console.error(error);
        alert("Message failed to send: " + error.message);
    } else {
        input.value = "";
    }

    sending = false;
    sendButton.disabled = false;
    input.focus();
}

sendButton.onclick = sendMessage;

input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

// ==========================================
// START CHAT
// ==========================================

async function startChat() {

    try {

        if (SUPABASE_URL.includes("YOUR_") ||
            SUPABASE_KEY.includes("YOUR_")) {
            throw new Error("Add your Supabase URL and publishable key.");
        }

        // Reuse an existing anonymous session or create one
        const { data: sessionData, error: sessionError } =
            await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        if (sessionData.session) {
            currentUser = sessionData.session.user;
        } else {

            const { data, error } =
                await supabase.auth.signInAnonymously();

            if (error) throw error;

            currentUser = data.user;
        }

        await loadMessages();

        connectRealtime();

    } catch (error) {

        console.error(error);

        statusText.textContent = "Connection failed";

        messagesBox.innerHTML =
            '<div class="system"></div>';

        messagesBox.querySelector(".system").textContent =
            error.message || "Could not connect to chat.";

    }

}

startChat();

</script>

</body>
</html>
